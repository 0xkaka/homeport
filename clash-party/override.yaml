# homeport · Clash Party 覆写
#
# 作用：Claude、Google、支付和风控相关域名统一走住宅出口 🏠住宅出口-勿选。
# 链路：本机 → HP_Relay（机场节点，自动测速）→ 🏠住宅出口-勿选（住宅 HTTP 代理）→ 目标站点。
#
# 使用前把 🏠住宅出口-勿选 的 server / port / username / password 换成自己的住宅代理。
# 改完以后别再点“更新”，否则会被链接里的占位符覆盖。
#
# HP_Relay = 机场里所有能用的节点，自动测速选最快的（哪个地区都行，跳板不影响最终 IP）。
#   - 只排除“到期时间 / 剩余流量 / 官网”这类信息节点，以及住宅出口自己（防止死循环）。
#   - 想排除某些烂节点 → 把关键字加进 exclude-filter，用 | 隔开。
# 所有中转都不能用时：删掉 proxy-groups+ 整段，dialer-proxy 改成 DIRECT。

proxies+:
  - name: 🏠住宅出口-勿选
    type: http
    server: "<HOST>"
    port: 0
    username: "<USERNAME>"
    password: "<PASSWORD>"
    dialer-proxy: HP_Relay
    # dialer-proxy: DIRECT

proxy-groups+:
  - name: HP_Relay
    type: url-test
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
    include-all: true
    exclude-filter: '(?i)住宅出口|到期|过期|剩余|官网|网址|失联|故障|重置|套餐|Expire|Traffic|Reset|^(DIRECT|REJECT|COMPATIBLE|PASS)$'

+rules:
  # Anthropic IPv6 段经住宅代理会 502，先拒掉，客户端会自动回落 IPv4
  - IP-CIDR6,2607:6bc0::/48,REJECT,no-resolve
  - IP-CIDR6,2607:6bc0:11::/48,REJECT,no-resolve

  # Claude / Anthropic
  - DOMAIN-SUFFIX,claude.ai,🏠住宅出口-勿选
  - DOMAIN-SUFFIX,claude.com,🏠住宅出口-勿选
  - DOMAIN-SUFFIX,clau.de,🏠住宅出口-勿选
  - DOMAIN-SUFFIX,anthropic.com,🏠住宅出口-勿选
  - DOMAIN-SUFFIX,claudeusercontent.com,🏠住宅出口-勿选
  - DOMAIN-SUFFIX,claudemcpcontent.com,🏠住宅出口-勿选
  - DOMAIN-SUFFIX,modelcontextprotocol.io,🏠住宅出口-勿选
  - DOMAIN-KEYWORD,anthropic,🏠住宅出口-勿选
  - DOMAIN-KEYWORD,claude,🏠住宅出口-勿选
  - IP-CIDR,160.79.104.0/21,🏠住宅出口-勿选,no-resolve
  - IP-ASN,399358,🏠住宅出口-勿选,no-resolve

  # 监控 / 风控 / 验证 / 支付
